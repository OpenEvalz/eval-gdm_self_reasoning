[project]
name = "openevalz-eval-gdm-self-reasoning"
version = "0.1.0"
description = "OpenEvalz packaging of GDM Dangerous Capabilities: Self-reasoning"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "gdm_self_reasoning"
execution_class = "sandbox-k8s"
cost_class = "high"
